<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Third Circle Partners</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --green: #1f4d3a;
  --cream: #f4efe6;
  --accent: #c9a45c;
  --text: #1c1c1c;
}

body {
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--cream);
}

.container {
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.hero, .about {
  display:grid;
  gap:40px;
}

img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* FIXED RATIO CONTAINERS */
.img-hero { height:380px; border-radius:12px; overflow:hidden; }
.img-about { height:400px; border-radius:12px; overflow:hidden; }
.img-small { width:80px; height:60px; border-radius:6px; overflow:hidden; }

/* RESPONSIVE */
@media (min-width:768px){
  .hero { grid-template-columns:1fr 1fr; }
  .about { grid-template-columns:1fr 1fr; }
}
</style>
</head>

<body>

<div class="container">

<h1>Build a more valuable business</h1>

<!-- HERO IMAGE -->
<div class="img-hero">
  <picture>
    <source srcset="
      images/hero-800.webp 800w,
      images/hero-1200.webp 1200w,
      images/hero-1600.webp 1600w
    " type="image/webp">

    <img src="images/hero-1200.jpg"
         srcset="
          images/hero-800.jpg 800w,
          images/hero-1200.jpg 1200w,
          images/hero-1600.jpg 1600w
         "
         sizes="(max-width:768px) 100vw, 50vw"
         alt="Business consulting"
         decoding="async"
         fetchpriority="high">
  </picture>
</div>

</div>

<!-- STEPS -->
<div class="container">

<div style="display:flex; gap:20px; margin:20px 0;">
  <div class="img-small">
    <img src="images/step1-200.jpg" loading="lazy" decoding="async">
  </div>
  <div>
    <strong>Discovery</strong>
    <p>Value Gap Assessment</p>
  </div>
</div>

<div style="display:flex; gap:20px;">
  <div class="img-small">
    <img src="images/step2-200.jpg" loading="lazy" decoding="async">
  </div>
  <div>
    <strong>Project</strong>
    <p>Focused work</p>
  </div>
</div>

</div>

<!-- ABOUT -->
<div class="container">
  <div class="about">

    <div class="img-about">
      <picture>
        <source srcset="
          images/founder-600.webp 600w,
          images/founder-1000.webp 1000w
        " type="image/webp">

        <img src="images/founder-1000.jpg"
             srcset="
              images/founder-600.jpg 600w,
              images/founder-1000.jpg 1000w
             "
             sizes="(max-width:768px) 100vw, 50vw"
             alt="Founder"
             loading="lazy"
             decoding="async">
      </picture>
    </div>

    <div>
      <h2>I’ve built it, scaled it, and exited it.</h2>
      <p>Now I help others do the same.</p>
    </div>

  </div>
</div>

</body>
</html>
